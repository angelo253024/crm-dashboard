<!DOCTYPE html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- SEO & WhatsApp Social Sharing Meta Tags -->
    <title>Lavamóvil Norte | Lavado de Autos a Domicilio en Santa Cruz</title>
    <meta name="description" content="Servicio premium de autolavado y detallado automotriz a domicilio en Santa Cruz de la Sierra. ¡Llegamos hasta tu casa u oficina!" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lavamóvil Norte | Lavado de Autos a Domicilio" />
    <meta property="og:description" content="Servicio premium de autolavado a domicilio en Santa Cruz de la Sierra. ¡Agenda tu cita online en segundos!" />
    <meta property="og:image" content="/logo.png" />
    
    <!-- PWA Config -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1CA9C9" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            },
            (err) => {
              console.log('ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
